    <title>鸡乐盒 Plus</title>

<body>

<div id="app">
    <!-- ===== 顶部 ===== -->
    <header class="header">
        <div class="header-visual">
            <div class="header-bg1"></div>
            <div class="header-bg2"></div>
            <div class="header-ji"></div>

                </div>
            </div>

                <button class="sound-btn" data-sound="like">喜欢</button>
                <button class="sound-btn" data-sound="wzdsn">真的是你</button>

                <button class="sound-btn" data-sound="hahaha">哈哈哈</button>
                <button class="sound-btn" data-sound="ma">ma～</button>
                <button class="sound-btn" data-sound="qm">制作人</button>
                <button class="sound-btn" data-sound="djh">大家好</button>
                <button class="sound-btn" data-sound="ws">我是</button>
                <button class="sound-btn" data-sound="kunkun">鲲鲲</button>
                <button class="sound-btn" data-sound="ngm">你干嘛~</button>
                <button class="sound-btn" data-sound="hh">哈哈</button>
                <button class="sound-btn" data-sound="ay">哎哟</button>
                <button class="sound-btn" data-sound="nhf">你好烦~</button>
                <button class="sound-btn" data-sound="aa">啊～</button>
                <button class="sound-btn sange" data-sound="jntm">开始吟唱</button>
                <button class="sound-btn sange" data-sound="ngmhhy">你干嘛哈哈哟</button>
                <button class="sound-btn sange" data-sound="yhhmgn">哟哈哈嘛干你</button>
            </div>
        </section>

        <!-- 音乐 -->

            <div class="panel-header">

            </div>
            <div class="sound-grid">
                <button class="sound-btn" data-sound="esj">二手鸡</button>

            <li>音频来自网络，未经原作者授权请勿商用。</li>
            <li>代码已在 GitHub 开源，<a href="https://github.com/lyryblog/ikun-home" target="_blank">点我跳转</a></li>

<audio id="audio" src="media/j.mp3" controlslist="nodownload" oncontextmenu="return false" preload="auto"></audio>
